org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# File-system watching hung for 19+ minutes in PosixFileSystemFunctions.listFileSystems (volume detection on
# Windows) before every build; the project does not need it.
org.gradle.vfs.watch=false

## Environment
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,26.2)
neo_version=26.1.2.122

## Dependencies
# Thaumaturge 1.1.0 for 26.1.2 (CurseForge project 1628024, file 9428045)
thaumaturge_cf_file=9428045
thaumaturge_version_range=[1.1.0,)
# Botania Revived 2.0.2 for 26.1.2 (unofficial NeoForge port, CurseForge project 1725641, file 9577666)
botania_cf_file=9577666
botania_version_range=[2.0.0,)
# Patchouli 26.1-94-beta (Modrinth project patchouli, version 2CsnFLom), required by Botania Revived
patchouli_modrinth_version=2CsnFLom
curios_version=15.0.0
# Lithostitched build used by Thaumaturge 1.1.0 (Modrinth project XaDC71GB, version 84kuUpr4)
lithostitched_modrinth_version=84kuUpr4

## Mod
mod_id=forgottenrelics
mod_name=Forgotten Relics
mod_license=WTFPL
mod_version=1.1.0-26.1.2
mod_group_id=com.integral.forgottenrelics
